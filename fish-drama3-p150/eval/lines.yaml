# Fixed test lines for Episode 0 (Fish Audio Drama 3 on one Tenstorrent p150).
# `text` is what the model is asked to say (spoken form); `written` is the reference for the word error rate.
# Do not change these once a baseline is logged: every number in results/ is measured on exactly these lines.
# The sentences are test material written early in the project for pronunciation and length coverage (numbers,
# model names, units). Prices and figures inside them are not measurements or current claims.

reference_voice:
  audio: ref_sebastian.wav   # 10.7 s, not in this repo (the channel owner's voice)
  text: "Big tech digs moats so you can't leave. On this channel I test whether you can climb out, what it costs, and whether the other side is actually better."

lines:
  - id: price
    text: "One RTX Pro six thousand costs about fifteen and a half thousand euros. Two Tenstorrent P one-fifty cards cost about a fifth of that."
    written: "One RTX Pro 6000 costs about fifteen and a half thousand euros. Two Tenstorrent P150 cards cost about a fifth of that."
  - id: model
    text: "The model is Kwen three point eight, twenty-seven billion parameters, at four-bit: N V F P four on the RTX, B F four on the Tenstorrent cards."
    written: "The model is Qwen 3.8, 27 billion parameters, at 4-bit: NVFP4 on the RTX, BF4 on the Tenstorrent cards."
  - id: specs
    text: "Each card has a hundred and twenty Tensix cores and four Q S F P D D ports. Speculative decoding with D Flash two gives us eighty-seven tokens per second."
    written: "Each card has 120 Tensix cores and four QSFP-DD ports. Speculative decoding with DFlash2 gives us 87 tokens per second."
  - id: close
    text: "So, did we exit the moat? Not yet. But the climb is shorter than I thought."
    written: "So, did we exit the moat? Not yet. But the climb is shorter than I thought."
  - id: cold_open
    text: "This is the sound of a fourteen-hundred-dollar AI card not working. I spent a whole day sure it was broken. Both of them. They weren't."
    written: "This is the sound of a $1,400 AI card not working. I spent a whole day sure it was broken. Both of them. They weren't."
  - id: server
    text: "Power on, the power supply shuts off. Without a power cable on the card, it still shuts off. With an old Radeon in the same slot, everything works."
    written: "Power on, the power supply shuts off. Without a power cable on the card, it still shuts off. With an old Radeon in the same slot, everything works."
  - id: second_opinion
    text: "Second opinion: my desktop. It boots, the card's fans spin, and Windows never sees it. Card two: identical. Two dead cards. I wrote the return ticket."
    written: "Second opinion: my desktop. It boots, the card's fans spin, and Windows never sees it. Card two: identical. Two dead cards. I wrote the return ticket."
  - id: fix
    text: "One last try with the power supply's own cable instead of the adapter. It boots. The card shows up, healthy. The adapter was the problem the whole time."
    written: "One last try with the power supply's own cable instead of the adapter. It boots. The card shows up, healthy. The adapter was the problem the whole time."
